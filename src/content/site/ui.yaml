# Short interface labels shared by every page.
# Most of these are not visible; they are what screen readers announce.

nav:
  label: Main

# EN/KR switch on bilingual pages
language:
  label: Language
  en: EN
  ko: KR

# Page-by-page lists
pagination:
  previous: Previous page
  next: Next page
  # {n} is replaced with the page number.
  page: Page {n}

# Pop-up windows
modal:
  close: Close

# Publication types, as shown on chips
publicationTypes:
  journal: Journal
  conference: Conference
  preprint: Preprint
  patent: Patent

# Carousels
carousel:
  previous: Previous
  next: Next

# Person cards (PI & Staffs, Team)
person:
  email: E-mail
  links:
    homepage: Homepage
    linkedin: LinkedIn
    scholar: Google Scholar
  # Shown in the striped placeholder until a photo is added. {path} is where the photo file should go.
  photoNote: "photo — {path} · 3:4"
