# Wording of the Projects page (/research/projects/).
# The projects themselves are in src/content/projects/.

page: projects
title: Projects # browser tab title

hero:
  title: Projects
  # {total} and {ongoing} are replaced with the counts.
  countLine: "{total} projects · {ongoing} ongoing"

perPage: 4 # cards per page (2-12)

filter:
  label: Status
  all: All
  ongoing: Ongoing
  done: Done
  empty: No projects in this status yet.

labels:
  agency: Agency
  period: Period
  role: Role
  overview: Overview
  related: Related publications
  relatedHint: Selecting a publication opens the Publications page at that entry.
  # {label} is replaced with the project title.
  openDetail: "{label} — open project detail"
  # Shown on a card until its cover image is added. {path} is where the image file should go.
  coverNote: "cover — {path} · 16:9 cover crop"
