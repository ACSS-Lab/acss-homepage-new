version: 2
updates:
  # npm 의존성(Astro, Sveltia 등)을 매주 확인해 업데이트 PR 생성
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 5
    ignore:
      # simple-icons dropped the LinkedIn icon in v14.
      # Member cards need it for the LinkedIn button, so stay on 13.x.
      - dependency-name: "simple-icons"
        update-types: ["version-update:semver-major"]

  # GitHub Actions 워크플로우가 쓰는 액션들도 함께 최신 유지
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"